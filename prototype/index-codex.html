<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 学习地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#fff;--ink:#000;--hairline:#e6e6e6;--hairline-soft:#f1f1f1;--surface-soft:#f7f7f5;
  --block-lime:#dceeb1;--block-lilac:#c5b0f4;--block-cream:#f4ecd6;
  --block-mint:#c8e6cd;--block-pink:#efd4d4;--block-coral:#f3c9b6;--block-navy:#1f1d3d;
  --accent-magenta:#ff3d8b;--success:#1ea64a;
  --sidebar-w:260px;
  --font:'Instrument Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-synthesis:none}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.72;letter-spacing:0;display:flex;height:100vh;overflow:hidden}
a{color:inherit;text-decoration:none;text-underline-offset:3px}
button{font:inherit;cursor:pointer;border:0;background:none}

/* ===== SIDEBAR — 春日手账风 ===== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:#e8f5e3;border-right:1px solid var(--hairline);display:flex;flex-direction:column;height:100vh;z-index:20;transition:transform .3s}
.sidebar-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--ink)}
.sidebar-brand .logo{width:30px;height:30px;border-radius:4px;background:var(--ink);color:var(--canvas);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.sidebar-search{padding:0 16px 14px}
.sidebar-search input{width:100%;height:40px;padding:0 14px;border:1px solid var(--hairline);border-radius:999px;background:var(--canvas);color:var(--ink);font-family:inherit;font-size:14px;outline:none}
.sidebar-search input::placeholder{color:#888}
.sidebar-search input:focus{border-color:var(--ink)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:0 0 12px}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:2px}
.nav-group{padding:10px 20px 4px;font-family:var(--mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#666}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:1px 8px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;transition:.12s;position:relative}
.nav-item:hover{background:var(--hairline-soft)}
.nav-item.active{background:var(--ink);color:var(--canvas)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:#888;padding:1px 7px;border-radius:99px;background:rgba(0,0,0,.06)}
.nav-item.active .count{background:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
.nav-item .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sidebar-progress{padding:14px 20px;border-top:1px solid var(--hairline);font-size:14px;color:#666}
.progress-bar{height:3px;border-radius:2px;background:var(--hairline);margin-top:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--accent-magenta);transition:width .4s}
.sidebar-toggle{display:none;position:fixed;top:14px;left:14px;z-index:30;width:40px;height:40px;border-radius:8px;background:var(--surface-soft);border:1px solid var(--hairline);font-size:18px;align-items:center;justify-content:center}

/* ===== CONTENT PANEL ===== */
.content{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--canvas)}
.content-bar{height:52px;min-height:52px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;padding:0 28px;gap:12px}
.content-bar .crumb{font-size:13.5px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px}
.content-bar .crumb a{cursor:pointer;border-bottom:1px solid currentColor}
.content-bar .crumb .sep{color:#ccc}
.content-bar .actions{margin-left:auto;display:flex;gap:8px}
.content-bar .actions button{font-size:12.5px;padding:6px 14px;border-radius:999px;border:1px solid var(--hairline);color:var(--ink);transition:.12s;background:var(--canvas)}
.content-bar .actions button:hover{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.content-scroll{flex:1;overflow-y:auto}
.content-scroll::-webkit-scrollbar{width:5px}
.content-scroll::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px}

/* ===== SECTION VIEW ===== */
.section-view{padding:40px 28px 72px;max-width:960px;margin:0 auto}
.section-header{margin-bottom:28px;padding:24px 28px;border-radius:12px}
.section-header .label{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;display:block;opacity:.6}
.section-header h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.section-header p{font-size:15px;opacity:.65;margin-top:8px;max-width:600px;line-height:1.6}
.section-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:8px;padding:20px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card.completed{border-color:var(--success);border-width:1px}
.card .kind{font-size:12px;font-weight:600;color:#999;margin-bottom:8px;display:block}
.card h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;line-height:1.3}
.card p{font-size:13.5px;color:#666;line-height:1.5}
.card .card-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline-soft);display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600}
.card:hover .card-foot{color:var(--accent-magenta)}
.card .card-foot .arrow{transition:transform .2s}
.card:hover .card-foot .arrow{transform:translateX(4px)}
.card .check{position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:50%;background:var(--success);display:none;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.card.completed .check{display:flex}

/* Color-coded section headers */
.sh-lime{background:var(--block-lime)}
.sh-lilac{background:var(--block-lilac)}
.sh-cream{background:var(--block-cream)}
.sh-mint{background:var(--block-mint)}
.sh-pink{background:var(--block-pink)}
.sh-coral{background:var(--block-coral)}
.sh-navy{background:var(--block-navy);color:var(--canvas)}
.sh-navy .label,.sh-navy p{opacity:.7}

/* ===== ARTICLE VIEW ===== */
.article-view{display:flex;max-width:1080px;margin:0 auto}
.article-toc{width:190px;min-width:190px;padding:36px 0 48px 28px;position:sticky;top:0;align-self:flex-start;max-height:calc(100vh - 52px);overflow-y:auto}
.article-toc .toc-label{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#bbb;margin-bottom:14px}
.article-toc a{display:block;padding:5px 0;font-size:13px;color:#888;line-height:1.4;border-left:2px solid transparent;padding-left:12px;margin-left:-12px;transition:.12s;cursor:pointer}
.article-toc a:hover{color:var(--ink)}
.article-toc a.active{color:var(--accent-magenta);border-left-color:var(--accent-magenta);font-weight:600}
.article-body{flex:1;padding:36px 36px 80px 36px;min-width:0}
.article-body h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:32px 0 12px;line-height:1.25;scroll-margin-top:70px}
.article-body h2:first-child{margin-top:0}
.article-body h3{font-size:17px;font-weight:600;margin:24px 0 8px;scroll-margin-top:70px}
.article-body p{font-size:15px;line-height:1.72;margin:8px 0;letter-spacing:0}
.article-body ul,.article-body ol{margin:8px 0;padding-left:20px}
.article-body li{font-size:14.5px;line-height:1.68;margin:3px 0}
.article-body pre{background:var(--ink);color:#e2e8f0;padding:16px 18px;border-radius:8px;font-family:var(--mono);font-size:13px;line-height:1.6;overflow-x:auto;margin:12px 0}
.article-body code{background:var(--surface-soft);color:var(--ink);border:1px solid var(--hairline);border-radius:3px;padding:1px 5px;font-family:var(--mono);font-size:.86em}
.article-body pre code{background:none;color:inherit;border:0;padding:0}
.article-body .table-wrap{overflow-x:auto;margin:12px 0}
.article-body table{width:100%;border-collapse:collapse;font-size:13.5px}
.article-body th{text-align:left;padding:8px 12px;background:var(--surface-soft);font-weight:700;border:1px solid var(--hairline);white-space:nowrap}
.article-body td{padding:8px 12px;border:1px solid var(--hairline);vertical-align:top}
.article-body .notice{background:var(--surface-soft);border-left:3px solid var(--ink);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:13.5px;color:#666}
.article-body strong{font-weight:700}
.article-body a{color:var(--accent-magenta);text-decoration:none;border-bottom:1px solid currentColor}
@media(max-width:860px){.article-toc{display:none}}

/* Search */
.search-results{padding:40px 28px 72px;max-width:960px;margin:0 auto}
.search-results .hint{color:#aaa;font-size:15px}

/* Home overview cards get pastel backgrounds */
.card.pastel-lime{background:var(--block-lime);border-color:transparent}
.card.pastel-lilac{background:var(--block-lilac);border-color:transparent}
.card.pastel-cream{background:var(--block-cream);border-color:transparent}
.card.pastel-mint{background:var(--block-mint);border-color:transparent}
.card.pastel-pink{background:var(--block-pink);border-color:transparent}
.card.pastel-coral{background:var(--block-coral);border-color:transparent}
.card.pastel-navy{background:var(--block-navy);color:var(--canvas);border-color:transparent}
.card.pastel-navy .kind,.card.pastel-navy p{color:rgba(255,255,255,.7)}
.card.pastel-navy .card-foot{color:rgba(255,255,255,.8);border-top-color:rgba(255,255,255,.15)}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:flex}
  .content{width:100%}
  .section-cards{grid-template-columns:1fr}
  .article-body{padding:24px 20px 60px}
}

/* ===== HOME VIEW ===== */
.home-view{padding:0;max-width:1080px;margin:0 auto}
.hero-spring{position:relative;margin:0 0 48px;border-radius:20px;overflow:hidden;padding:64px 48px;min-height:360px;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;overflow:hidden;z-index:0}
.hb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.hb1{width:300px;height:300px;background:#dceeb1;top:-60px;left:-40px}
.hb2{width:250px;height:250px;background:#c5b0f4;top:-40px;right:60px}
.hb3{width:200px;height:200px;background:#f3c9b6;bottom:-50px;left:30%}
.hb4{width:220px;height:220px;background:#c8e6cd;bottom:-40px;right:-30px}
.hb5{width:180px;height:180px;background:#efd4d4;top:30%;left:40%}
.hero-content{position:relative;z-index:1;max-width:640px}
.hero-eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--accent-magenta);margin-bottom:16px}
.hero-title{font-size:clamp(32px,4.5vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:18px}
.hero-sub{font-size:17px;line-height:1.65;color:#555;max-width:560px;margin-bottom:28px}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap}
.hero-stats .hs{display:flex;align-items:baseline;gap:8px}
.hero-stats .hs b{font-size:32px;font-weight:800;color:var(--ink)}
.hero-stats .hs span{font-size:14px;color:#999}

/* Journey track */
.journey-section{margin:0 28px 56px;padding:36px 32px;background:var(--surface-soft);border-radius:16px}
.journey-label{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin-bottom:8px}
.journey-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px}
.journey-track{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:8px}
.journey-node{flex:0 0 auto;width:170px;padding:20px 16px;border-radius:14px;background:var(--node-bg);color:var(--node-fg);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:8px}
.journey-node:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.jn-num{font-family:var(--mono);font-size:13px;font-weight:700;opacity:.5}
.jn-name{font-size:18px;font-weight:700;letter-spacing:-.01em}
.jn-count{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.6}
.jn-desc{font-size:12.5px;line-height:1.45;opacity:.7;margin-top:4px}
.journey-arrow{flex:0 0 auto;display:flex;align-items:center;padding:0 6px;font-size:20px;color:#ccc;font-weight:300}

/* Highlight cards */
.highlight-section{margin:0 28px 48px}
.hl-label{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin-bottom:8px}
.hl-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px}
.hl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.hl-card{padding:24px 20px;border-radius:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;min-height:160px}
.hl-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.hl-kind{font-family:var(--mono);font-size:11px;font-weight:500;opacity:.5;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.hl-card h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;line-height:1.25}
.hl-card p{font-size:13px;line-height:1.45;opacity:.7;flex:1}
.hl-go{font-size:13px;font-weight:600;margin-top:14px}

/* CTA */
.home-cta{margin:0 28px 64px;padding:22px 32px;border-radius:14px;background:var(--block-navy);color:var(--canvas);font-size:17px;font-weight:600;cursor:pointer;transition:transform .2s;text-align:center}
.home-cta:hover{transform:translateY(-2px)}

@media(max-width:768px){
  .hero-spring{padding:40px 24px;min-height:auto}
  .journey-track{flex-direction:column}
  .journey-arrow{transform:rotate(90deg);align-self:center}
}
</style>
</head>
<body>

<button class="sidebar-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><span class="logo">A</span> Agent 学习地图</div>
  <div class="sidebar-search"><input type="search" id="searchInput" placeholder="搜索教程..." oninput="handleSearch(this.value)"></div>
  <div class="sidebar-scroll" id="sidebarNav"></div>
  <div class="sidebar-progress">
    <span id="progressLabel">0 / 43 篇已学完</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0"></div></div>
  </div>
</aside>

<main class="content">
  <div class="content-bar" id="contentBar">
    <div class="crumb" id="crumb"></div>
    <div class="actions" id="actions"></div>
  </div>
  <div class="content-scroll" id="contentScroll"></div>
</main>

<script src="content-data.js"></script>
<script>
window.onerror = function(msg, url, line, col, err) {
  const box = document.getElementById('contentScroll') || document.body;
  box.innerHTML = '<div style="padding:24px;font-family:sans-serif;line-height:1.6;"><h2 style="color:#c00">页面加载出错</h2><pre style="background:#f7f7f5;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px;">' + String(msg) + '\\nLine: ' + line + '\\nCol: ' + col + '\\n' + (err && err.stack ? err.stack : '') + '</pre></div>';
  return true;
};
const sections = [
  { id:'beginners', group:'入门', title:'零基础 AI 新手课', desc:'从最常用的 AI 名词开始，建立基础词汇表和操作手感。', color:'lime', cards:['ai_beginner_101','gemini_sop','notebooklm_sop'] },
  { id:'applications', group:'入门', title:'医药 AI 效率进阶应用', desc:'海报、PPT、视频、看板、检索、市场分析——六大场景实战。', color:'cream', cards:['ai_poster','ai_ppt','ai_video','ai_dashboard','ai_research','ai_market_analysis'] },
  { id:'paths', group:'开发', title:'进阶开发路径', desc:'从 Cursor 入门到 GitHub SOP，用 AI 辅助开发工作流。', color:'navy', cards:['cursor','github','repo','sop_writer'] },
  { id:'tools', group:'工具', title:'热门工具学习页', desc:'主流 AI 工具的对比指南和使用入口。', color:'mint', cards:['cursor','tool_research','github_project_reader','prompt_optimizer','claude_code','trae','codex','workbuddy'] },
  { id:'sops', group:'工具', title:'常用 SOP 流程与 Agent Skills', desc:'标准作业流程模板和可复用的 Agent Skills。', color:'', cards:['github','mcp_helper','error_troubleshooter','risk_safety_review','prompt_template_skill'] },
  { id:'prd', group:'设计', title:'PRD 专题', desc:'用 AI 从模糊想法推进到可交付的需求文档。', color:'pink', cards:['ai_prd_guide'] },
  { id:'uiux', group:'设计', title:'从 PRD 到可交付 UI', desc:'PRD -> 低保真线框图 -> 高保真 UI -> 前端 Demo。', color:'lilac', cards:['prd_to_ui','call_insight_stitch','uiux_tools_map'] },
  { id:'deployment', group:'部署', title:'部署与分享', desc:'静态网站托管和微信分享卡片配置。', color:'', cards:['static_hosting_guide','wechat_sharing_guide'] },
  { id:'dashboard-deploy', group:'部署', title:'Dashboard 部署实战', desc:'把本地 HTML 看板发布成公开 URL，CHECK -> DEPLOY -> VERIFY -> PEER TEST。', color:'mint', cards:['dashboard_deploy'] },
  { id:'data-analytics', group:'进阶', title:'数据分析 Agent Skills', desc:'14 个 skill 路由、10 种场景组合、I/O 协议和质量门槛。', color:'coral', cards:['data_analytics_workflow','non_codex_analytics_prompt'] },
  { id:'skill-mastery', group:'进阶', title:'Skill 理论与实战', desc:'Agent 分类、Skill 六要素、会议纪要 Case、高质量 Skill 获取。', color:'lime', cards:['skill_theory','meeting_minutes_skill','skill_acquisition','cc_switch_deepseek'] },
  { id:'geo-mastery', group:'进阶', title:'GEO 监测实战', desc:'从搜索结果到 AI 答案，开发端到端 GEO 监测工具。', color:'navy', cards:['geo_concept','geo_requirements','geo_development'] },
  { id:'video-gen', group:'创作', title:'AI 视频生成', desc:'万能提示词公式、六步工作流和思福诺暖场视频实战 Case。', color:'coral', cards:['ai_video_workflow','video_case_sifuno'] }
];

let currentSection = null;
let currentKey = null;
let completedKeys = JSON.parse(localStorage.getItem('completedKeys') || '[]');
const keyToSection = {};
sections.forEach(s => s.cards.forEach(k => { if(!keyToSection[k]) keyToSection[k] = s; }));

const entryLabels = {
  ai_beginner_101:'AI 核心名词手册', gemini_sop:'Gemini SOP', notebooklm_sop:'NotebookLM SOP',
  ai_poster:'AI 海报制作', ai_ppt:'AI PPT 生成', ai_video:'AI 数字人视频',
  ai_dashboard:'AI 数据看板', ai_research:'AI 学术检索', ai_market_analysis:'AI 市场分析',
  cursor:'Cursor 新手指南', github:'GitHub 下载 SOP', repo:'仓库解读模板',
  sop_writer:'SOP 撰写 Skill', tool_research:'AI 工具研究', github_project_reader:'GitHub 项目阅读',
  prompt_optimizer:'Prompt 调优', claude_code:'Claude Code', trae:'Trae', codex:'Codex', workbuddy:'WorkBuddy',
  mcp_helper:'MCP 配置', error_troubleshooter:'排错 Skill', risk_safety_review:'安全审查',
  prompt_template_skill:'Prompt 模板 Skill', ai_prd_guide:'AI PRD 指南',
  prd_to_ui:'PRD -> UI', call_insight_stitch:'Call Insight 实操', uiux_tools_map:'UIUX 工具地图',
  static_hosting_guide:'静态部署指南', wechat_sharing_guide:'微信分享排错',
  dashboard_deploy:'Dashboard 部署全流程', data_analytics_workflow:'数据分析 Skills 工作流',
  non_codex_analytics_prompt:'非 Codex 分析提示词', skill_theory:'Skill 理论知识',
  meeting_minutes_skill:'会议纪要 Skill Case', skill_acquisition:'高质量 Skill 获取',
  cc_switch_deepseek:'CC Switch 接入 DeepSeek', geo_concept:'GEO 概念入门',
  geo_requirements:'GEO 工具页面设计', geo_development:'GEO 开发指南',
  ai_video_workflow:'AI 视频工作流', video_case_sifuno:'思福诺视频实战 Case'
};

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  let html = '';
  let lastGroup = '';
  const groupColors = {'入门':'lime','开发':'navy','工具':'mint','设计':'lilac','部署':'cream','进阶':'coral','创作':'pink'};
  sections.forEach(s => {
    if (s.group !== lastGroup) {
      html += `<div class="nav-group">${s.group}</div>`;
      lastGroup = s.group;
    }
    const colorClass = s.color ? `dot` : '';
    const dotStyle = s.color ? `style="background:var(--block-${s.color})"` : '';
    html += `<div class="nav-item" data-section="${s.id}" onclick="showSection('${s.id}')">
      ${s.color ? `<span class="dot" ${dotStyle}></span>` : ''}
      <span>${s.title}</span>
      <span class="count">${s.cards.length}</span>
    </div>`;
  });
  nav.innerHTML = html;
}

function highlightSidebar(sectionId) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === sectionId);
  });
}

function showSection(sectionId) {
  const s = sections.find(x => x.id === sectionId);
  if (!s) return;
  currentSection = s;
  highlightSidebar(sectionId);
  document.querySelector('.sidebar').classList.remove('open');

  const scroll = document.getElementById('contentScroll');
  const cardHtml = s.cards.map(key => {
    const d = content[key];
    if (!d) return '';
    const done = completedKeys.includes(key) ? 'completed' : '';
    return `<div class="card ${done}" onclick="showArticle('${key}')">
      <div class="check">&#10003;</div>
      <div class="kind">${getKind(key)}</div>
      <h3>${d.title}</h3>
      <p>${stripHtml(d.html).slice(0, 100)}...</p>
      <div class="card-foot"><span>开始学习</span><span class="arrow">&#8594;</span></div>
    </div>`;
  }).join('');

  const shClass = s.color ? `sh-${s.color}` : '';
  scroll.innerHTML = `<div class="section-view">
    <div class="section-header ${shClass}">
      <span class="label">${s.group}</span>
      <h1>${s.title}</h1>
      <p>${s.desc}</p>
    </div>
    <div class="section-cards">${cardHtml}</div>
  </div>`;
  scroll.scrollTop = 0;
  document.getElementById('crumb').innerHTML = `${s.group} <span class="sep">/</span> ${s.title}`;
  document.getElementById('actions').innerHTML = '';
}

function showArticle(key) {
  const d = content[key];
  if (!d) return;
  currentKey = key;
  const s = keyToSection[key] || currentSection;

  const tocHtml = d.toc.length ? `<div class="article-toc">
    <div class="toc-label">目录</div>
    ${d.toc.map((t, i) => `<a onclick="scrollToH2(${i})" data-idx="${i}">${t}</a>`).join('')}
  </div>` : '';

  document.getElementById('contentScroll').innerHTML = `<div class="article-view">
    ${tocHtml}
    <div class="article-body" id="articleBody">${d.html}</div>
  </div>`;
  document.getElementById('contentScroll').scrollTop = 0;

  const isDone = completedKeys.includes(key);
  document.getElementById('crumb').innerHTML = `${s ? `<a onclick="showSection('${s.id}')">${s.title}</a> <span class="sep">/</span> ` : ''}${d.title}`;
  document.getElementById('actions').innerHTML = `
    <button onclick="toggleComplete('${key}')">${isDone ? '已学完 &#10003;' : '标记已学完'}</button>
    <button onclick="copyPrompt('${key}')">复制 Prompt</button>
  `;
  trackToc();
}

function scrollToH2(idx) {
  const body = document.getElementById('articleBody');
  const h2s = body.querySelectorAll('h2');
  if (h2s[idx]) {
    h2s[idx].scrollIntoView({ behavior:'smooth', block:'start' });
    document.querySelectorAll('.article-toc a').forEach(a => a.classList.remove('active'));
    document.querySelector(`.article-toc a[data-idx="${idx}"]`)?.classList.add('active');
  }
}

function trackToc() {
  const body = document.getElementById('articleBody');
  if (!body) return;
  const h2s = body.querySelectorAll('h2');
  const tocLinks = document.querySelectorAll('.article-toc a');
  if (!tocLinks.length) return;
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const idx = Array.from(h2s).indexOf(e.target);
        if (idx >= 0) {
          tocLinks.forEach(a => a.classList.remove('active'));
          tocLinks[idx]?.classList.add('active');
        }
      }
    });
  }, { rootMargin: '-60px 0px -70% 0px' });
  h2s.forEach(h => observer.observe(h));
}

function handleSearch(q) {
  if (!q.trim()) {
    if (currentSection) showSection(currentSection.id);
    else showHome();
    return;
  }
  q = q.toLowerCase();
  const results = [];
  Object.keys(content).forEach(key => {
    const d = content[key];
    const text = (d.title + ' ' + (entryLabels[key]||'') + ' ' + stripHtml(d.html)).toLowerCase();
    if (text.includes(q)) results.push(key);
  });
  const s = results.map(key => {
    const d = content[key];
    const sec = keyToSection[key];
    return `<div class="card" onclick="showArticle('${key}')">
      <div class="kind">${sec ? sec.title : ''}</div>
      <h3>${d.title}</h3>
      <p>${stripHtml(d.html).slice(0, 100)}...</p>
      <div class="card-foot"><span>查看</span><span class="arrow">&#8594;</span></div>
    </div>`;
  }).join('');
  document.getElementById('contentScroll').innerHTML = `<div class="search-results">
    <div class="section-header"><h1>搜索结果</h1><p>找到 ${results.length} 篇匹配的教程</p></div>
    <div class="section-cards">${s || '<div class="hint">没有找到匹配内容，试试其他关键词</div>'}</div>
  </div>`;
  document.getElementById('crumb').innerHTML = `搜索: &quot;${q}&quot;`;
  document.getElementById('actions').innerHTML = '';
}

function toggleComplete(key) {
  if (completedKeys.includes(key)) {
    completedKeys = completedKeys.filter(k => k !== key);
  } else {
    completedKeys.push(key);
  }
  localStorage.setItem('completedKeys', JSON.stringify(completedKeys));
  updateProgress();
  showArticle(key);
}

function copyPrompt(key) {
  const d = content[key];
  if (d && d.prompt) {
    navigator.clipboard.writeText(d.prompt).then(() => {
      const btn = document.querySelector('#actions button:last-child');
      if (btn) { btn.textContent = '已复制 \u2713'; setTimeout(() => btn.textContent = '\u590d\u5236 Prompt', 1500); }
    });
  }
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || '';
}

function getKind(key) {
  const d = content[key];
  if (!d) return '';
  const firstH3 = d.html.match(/<h3>(.*?)<\/h3>/);
  return firstH3 ? firstH3[1] : (d.toc[0] || '');
}

function updateProgress() {
  const total = Object.keys(content).length;
  const done = completedKeys.filter(k => content[k]).length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressLabel').textContent = `${done} / ${total} 篇已学完`;
  document.getElementById('progressFill').style.width = `${pct}%`;
}

function showHome() {
  highlightSidebar('');
  const total = Object.keys(content).length;
  const groups = {};
  sections.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });
  const groupOrder = ['入门','开发','工具','设计','部署','进阶','创作'];
  const groupDesc = {
    '入门':'从 AI 名词到业务场景，从零开始建立认知和手感',
    '开发':'用 Cursor、GitHub 和 Agent 辅助开发，从新手到项目落地',
    '工具':'主流 AI 工具横向对比，SOP 流程模板和可复用 Skills',
    '设计':'从模糊 PRD 到可交付 UI，产品化思维和视觉设计实战',
    '部署':'把本地页面发布成公开 URL，静态托管到 CloudBase 全流程',
    '进阶':'数据分析、Skill 理论、GEO 监测——AI 工作流深度实战',
    '创作':'AI 视频生成工作流，从提示词到成片的全链路实践'
  };
  const groupColors = {'入门':'lime','开发':'navy','工具':'mint','设计':'lilac','部署':'cream','进阶':'coral','创作':'pink'};

  let heroHtml = `
    <div class="hero-spring">
      <div class="hero-bg">
        <span class="hb hb1"></span><span class="hb hb2"></span>
        <span class="hb hb3"></span><span class="hb hb4"></span>
        <span class="hb hb5"></span>
      </div>
      <div class="hero-content">
        <div class="hero-eyebrow">AI AGENT LEARNING MAP</div>
        <h1 class="hero-title">给 AI 初学者的<br>一张工具学习路线图</h1>
        <p class="hero-sub">从零基础 AI 入门到 GEO 监测实战，从 Prompt 到 Skill，从单文件 HTML 到端到端 Agent 工作流——一条完整的学习路径，逐步解锁你的 AI 实用与进阶能力。</p>
        <div class="hero-stats">
          <div class="hs"><b>${total}</b><span>篇教程</span></div>
          <div class="hs"><b>${sections.length}</b><span>个板块</span></div>
          <div class="hs"><b>${completedKeys.filter(k=>content[k]).length}</b><span>已学完</span></div>
        </div>
      </div>
    </div>`;

  let journeyHtml = `<div class="journey-section">
    <div class="journey-label">LEARNING PATH</div>
    <h2 class="journey-title">学习路径总览</h2>
    <div class="journey-track">`;

  groupOrder.forEach((g, i) => {
    const color = groupColors[g];
    const bgColor = color === 'navy' ? 'var(--block-navy)' : `var(--block-${color})`;
    const textColor = color === 'navy' ? 'var(--canvas)' : 'var(--ink)';
    const secs = groups[g] || [];
    const cardCount = secs.reduce((sum, s) => sum + s.cards.length, 0);
    journeyHtml += `
      <div class="journey-node" style="--node-bg:${bgColor};--node-fg:${textColor}" onclick="showSection('${secs[0]?.id||""}')">
        <div class="jn-num">${String(i+1).padStart(2,'0')}</div>
        <div class="jn-body">
          <div class="jn-name">${g}</div>
          <div class="jn-count">${cardCount} 篇教程</div>
          <div class="jn-desc">${groupDesc[g]}</div>
        </div>
      </div>`;
    if (i < groupOrder.length - 1) {
      journeyHtml += `<div class="journey-arrow">&rarr;</div>`;
    }
  });
  journeyHtml += `</div></div>`;

  let highlightHtml = `<div class="highlight-section">
    <div class="hl-label">START HERE</div>
    <h2 class="hl-title">从这里开始</h2>
    <div class="hl-cards">`;
  const startKeys = ['ai_beginner_101','cursor','skill_theory','geo_concept','ai_video_workflow'];
  const hlColors = ['lime','mint','cream','navy','coral'];
  startKeys.forEach((key, i) => {
    const d = content[key];
    if (!d) return;
    const c = hlColors[i];
    const bg = c === 'navy' ? 'var(--block-navy)' : `var(--block-${c})`;
    const fg = c === 'navy' ? 'var(--canvas)' : 'var(--ink)';
    highlightHtml += `
      <div class="hl-card" style="background:${bg};color:${fg}" onclick="showArticle('${key}')">
        <div class="hl-kind">${keyToSection[key]?.title || ''}</div>
        <h3>${d.title}</h3>
        <p>${d.toc[0] || stripHtml(d.html).slice(0,60)}</p>
        <div class="hl-go">开始学习 &rarr;</div>
      </div>`;
  });
  highlightHtml += `</div></div>`;

  let ctaHtml = `<div class="home-cta" onclick="showSection('beginners')">
    <span>从第一个微小任务开始，而不是从一大堆概念开始 &rarr;</span>
  </div>`;

  document.getElementById('contentScroll').innerHTML = `<div class="home-view">
    ${heroHtml}
    ${journeyHtml}
    ${highlightHtml}
    ${ctaHtml}
  </div>`;
  document.getElementById('contentScroll').scrollTop = 0;
  document.getElementById('crumb').innerHTML = '首页';
  document.getElementById('actions').innerHTML = '';
}

try {
  renderSidebar();
  updateProgress();
  showHome();
} catch(e) {
  const box = document.getElementById('contentScroll') || document.body;
  box.innerHTML = '<div style="padding:24px;font-family:sans-serif;line-height:1.6;"><h2 style="color:#c00">初始化出错</h2><pre style="background:#f7f7f5;padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:13px;">' + e.message + '\\n' + (e.stack || '') + '</pre></div>';
}
</script>
</body>
</html>
